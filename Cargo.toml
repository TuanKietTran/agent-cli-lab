[package]
name = "agent-cli-lab"
version = "0.1.0"
edition = "2024"
description = "Run and test interactive CLI programs through a PTY-friendly proxy"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vt100 = "0.15"

[dev-dependencies]
tempfile = "3.20"
